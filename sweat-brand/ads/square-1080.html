<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sweat — square 1080</title>
<link rel="icon" href="../img/sweat-favicon.png">
<link rel="stylesheet" href="../system/tokens.css">
<link rel="stylesheet" href="../system/system.css">
</head>
<body>

<!-- ==================================================================
     SQUARE  1080x1080  ·  feed post
     The statement ad: no photograph, the typography is the picture.
     Edit the copy in place. Keep the headline to two or three lines —
     at this size a fourth pushes the display size down past the point
     where it reads as a statement.
     ================================================================== -->

<div class="ad grain" style="--cw:1080; --ch:1080">

  <!-- the blue field, thrown off the bottom-right corner -->
  <div class="blob blob--a" style="right:-32%; bottom:-38%"></div>
  <div class="blob blob--c" style="left:-26%; top:-30%; opacity:.4"></div>

  <div class="mark mark--tl">
    <span class="mark__name">Sweat Strategies</span>
    <span class="mark__url">sweatstrategies.com</span>
  </div>

  <div class="pad pad--end">
    <div class="label" style="margin-bottom:var(--space-m)">Music marketing</div>

    <h1 class="display display--l">
      Have you got<br>
      a <span class="hl">song</span>?
    </h1>

    <p class="body body--wide" style="margin-top:var(--space-m)">
      Most artists never find out. We test the record until the data says which
      one it is — then put the spend behind that.
    </p>

    <a class="cta" style="margin-top:var(--space-l)" href="#">
      Start a campaign <span class="cta__arr">&rarr;</span>
    </a>
  </div>

</div>

<script type="module" src="./frame.js"></script>
</body>
</html>
