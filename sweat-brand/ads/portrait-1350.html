<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sweat — portrait 1350</title>
<link rel="icon" href="../img/sweat-favicon.png">
<link rel="stylesheet" href="../system/tokens.css">
<link rel="stylesheet" href="../system/system.css">
</head>
<body>

<!-- ==================================================================
     PORTRAIT  1080x1350  ·  feed post, 4:5
     The artist ad: a bent card carrying the photograph, figures under it.

     The photograph and the figures must be the same artist. See the house
     rules in ../README.md — a card next to a number reads as that number's
     artist whether or not the caption says so, and the deck work already
     had to unpick one of these.

     Swap the <img> for any file in ../img — but run an untreated one
     through scripts/lens.mjs first, or it sits flat against everything
     else in the system.
     ================================================================== -->

<div class="ad grain grain--soft" style="--cw:1080; --ch:1350">

  <div class="blob blob--b" style="left:-34%; top:6%"></div>
  <div class="spine" style="--spine-x:calc(392 * var(--u)); opacity:.22"></div>

  <div class="mark mark--tl">
    <span class="mark__name">Sweat Strategies</span>
  </div>

  <div class="pad pad--mid" style="padding-top:calc(210 * var(--u))">

    <!-- the bent card. --u keeps it proportional; change only width/height. -->
    <div class="bend bend--right" style="align-self:center; margin-bottom:var(--space-xl)">
      <div class="bend__inner">
        <div class="bend__cap">The Listros</div>
        <div style="width:calc(560 * var(--u)); height:calc(430 * var(--u)); overflow:hidden">
          <img src="../img/the-listros.jpg" alt="The Listros">
        </div>
      </div>
    </div>

    <div class="label" style="margin-bottom:var(--space-s)">Case study</div>

    <h1 class="display display--s" style="max-width:calc(840 * var(--u))">
      2M monthly streams at their peak
    </h1>

    <dl class="stats" style="margin-top:var(--space-l); gap:calc(76 * var(--u))">
      <div><dt>Spend</dt><dd>$1–3K</dd></div>
      <div><dt>Cost per result</dt><dd>$0.11</dd></div>
    </dl>

    <p class="body body--s body--wide" style="margin-top:var(--space-l)">
      Found the sound, tested the content at scale, then scaled only what
      converted.
    </p>

  </div>

</div>

<script type="module" src="./frame.js"></script>
</body>
</html>
